<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kana Conversion</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }
    
        .container {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            margin: 10px;
            position: relative;
            z-index: 1;
        }
    
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
    
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
    
        label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
            color: #555;
        }
    
        input[type="text"] {
            width: calc(100% - 20px);
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
    
        button {
            background-color: #007BFF;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
    
        button:hover {
            background-color: #0056b3;
        }
    
        .results {
            margin-top: 20px;
        }
    
        .notification {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #28a745;
            color: white;
            padding: 10px;
            border-radius: 4px;
            display: none;
            transition: opacity 0.5s ease;
            z-index: 10;
        }
    
        footer {
            margin-top: 20px;
            color: #777;
            font-size: 14px;
        }
    
        .result-item {
            background-color: #f9f9f9;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }
    
        .result-label {
            font-weight: bold;
            color: #333;
            width: 150px;
            text-align: left;
            flex-shrink: 0;
        }
    
        .result-value {
            font-size: 16px;
            color: #555;
            word-wrap: break-word;
            flex-grow: 1;
            margin-left: 10px;
            min-width: 0;
            overflow-wrap: break-word;
            white-space: normal;
        }
    
        .copy-button {
            width: 80px;
            flex-shrink: 0;
            margin-left: 10px;
        }
    
        .copy-button:hover {
            background-color: #218838;
        }
    
        @media (max-width: 600px) {
            .result-item {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
    
            .result-label {
                width: auto;
                text-align: center;
                margin-bottom: 5px;
            }
    
            .result-value {
                width: 100%;
                margin-left: 0;
                text-align: center;
            }
    
            .copy-button {
                margin-top: 5px;
                width: auto;
                text-align: center;
            }
        }
    
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
    
        .spinner {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #007BFF;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
    
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kana Conversion</h1>
        <div id="llmGreeting" style="margin-bottom: 20px; font-weight: bold;"></div>
        <div class="form-group">
            <label for="inputText">Enter Kanji, Katakana, or Hiragana:</label>
            <input type="text" id="inputText" placeholder="Enter text to convert">
        </div>
        <button onclick="performConversion()">Convert</button>

        <div class="results" id="results" style="display:none;">
            <div class="result-item">
                <span class="result-label">Hiragana:</span>
                <span class="result-value" id="hiraganaResult"></span>
                <button class="copy-button" onclick="copyToClipboard('hiraganaResult')">Copy</button>
            </div>
            <div class="result-item">
                <span class="result-label">Katakana:</span>
                <span class="result-value" id="katakanaResult"></span>
                <button class="copy-button" onclick="copyToClipboard('katakanaResult')">Copy</button>
            </div>
            <div class="result-item">
                <span class="result-label">Half Width Katakana:</span>
                <span class="result-value" id="halfWidthKatakanaResult"></span>
                <button class="copy-button" onclick="copyToClipboard('halfWidthKatakanaResult')">Copy</button>
            </div>
            <div class="result-item">
                <span class="result-label">Romanji:</span>
                <span class="result-value" id="romanjiResult"></span>
                <button class="copy-button" onclick="copyToClipboard('romanjiResult')">Copy</button>
            </div>
        </div>

        <div class="notification" id="copyNotification">Copied!</div>

        <footer>
            © 2024 Shichan
        </footer>
    </div>

    <script>
        window.onload = function() {
            fetchGreeting();
            fetch('https://tondabayashi.onrender.com/ping')
                .then(response => response.json())
                .then(data => console.log(data.status)) // Logs "alive" if successful
                .catch(error => console.error('Error pinging the server:', error));
        };
        async function performConversion() {
            const text = document.getElementById('inputText').value;

            if (!text.trim()) {
                alert('Please enter text to convert.');
                return;
            }

            // Show overlay and disable button
            document.getElementById('loadingOverlay').style.display = 'flex';
            const convertButton = document.querySelector('button');
            convertButton.disabled = true;

            const apiURL = 'https://tondabayashi.onrender.com/convert';

            try {
                const response = await fetch(apiURL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: text }),
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch');
                }

                const data = await response.json();

                document.getElementById('hiraganaResult').textContent = data.hiragana;
                document.getElementById('katakanaResult').textContent = data.katakana;
                document.getElementById('halfWidthKatakanaResult').textContent = data.halfWidthKatakana;
                document.getElementById('romanjiResult').textContent = data.romanji;

                document.getElementById('results').style.display = 'block';
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                // Hide overlay and enable button
                document.getElementById('loadingOverlay').style.display = 'none';
                convertButton.disabled = false;
            }
        }

        function copyToClipboard(resultId) {
            const resultText = document.getElementById(resultId).textContent;
            navigator.clipboard.writeText(resultText).then(() => {
                showNotification();
            }).catch(err => {
                console.error("Error copying text: ", err);
            });
        }

        function showNotification() {
            const notification = document.getElementById('copyNotification');
            notification.style.display = 'block';
            notification.style.opacity = '1';

            setTimeout(() => {
                notification.style.opacity = '0';
                setTimeout(() => {
                    notification.style.display = 'none';
                }, 500); // Hide after fade-out
            }, 1500); // Display for 1.5 seconds
        }
        async function fetchGreeting() {
            const response = await fetch("/.netlify/functions/greeting");

            if (!response.ok) {
                console.error("Failed to get greeting:", response.statusText);
                return;
            }

            const data = await response.json();
            const cleanMessage = data.message.replace(/^"(.*)"$/, '$1'); // Removes quotes if they wrap the string
            typeWriterEffect(cleanMessage, document.getElementById("llmGreeting"), 40); // 40ms per letter
        }

        function typeWriterEffect(text, element, delay = 50) {
            element.textContent = ''; // Clear any previous text
            let i = 0;
            function type() {
                if (i < text.length) {
                    element.textContent += text.charAt(i);
                    i++;
                    setTimeout(type, delay);
                }
            }
            type();
        }
    </script>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>
</body>
</html>
