<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Shichan</title>
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('homeTab')">🏠 <span data-key="home">Home</span></button>
            <button class="tab-button" onclick="switchTab('summaryTab')">📝 <span data-key="summary">Website Summarizer</span></button>
            <button class="tab-button" onclick="switchTab('kanaTab')">🔤 <span data-key="kana">Kana Converter</span></button>
            <button class="tab-button" onclick="switchTab('mapTab')">🗺️ <span data-key="mapGame">Map Game</span></button>
            <select class="language-select" id="languageSelect" onchange="setLanguage(this.value)">
                <option value="en">🇺🇸 EN</option>
                <option value="ja">🇯🇵 JA</option>
            </select>
        </div>

        <div class="tab-content active" id="homeTab">
            <div class="page">
                <div class="container">
                    <h1 data-key="welcome">Welcome</h1>
                    <p id="chooseTab" data-key="chooseTab"></p>
                    <p id="homeGreeting"></p>
                </div>
            </div>
        </div>

        <div class="tab-content" id="summaryTab">
            <div class="page">
                <div class="container">
                    <h1 data-key="summaryTitle">Website Summarizer</h1>
                    
                    <div class="form-group">
                        <label for="urlInput" data-key="enterSummarizeUrl">Enter URL to summarize:</label>
                        <input type="text" id="urlInput" placeholder="Enter URL here" />
                    </div>
                    
                    <button onclick="summarizeWebsite()" data-key="summarize">Summarize</button>
                    <div id="summaryLoading" class="spinner" style="display:none;"></div>
                    <div id="summaryResult" class="hidden"></div>
                </div>
            </div>
        </div>                  

        <div class="tab-content" id="kanaTab">
            <div class="page">
                <div class="container">
                    <h1 data-key="kanaTitle">Kana Conversion</h1>
                    <p id="kanaGreeting"></p>
                    <div class="form-group">
                        <label for="inputText" data-key="inputLabel">Enter Kanji, Katakana, or Hiragana:</label>
                        <input type="text" id="inputText" placeholder="Enter Japanese text here" />
                    </div>
                    <button id="convertButton" onclick="performConversion()" data-key="convert">Convert</button>
                    <div class="form-group conversion-method-group">
                        <label for="conversionMethod" data-key="methodLabel">Language Model for Conversion</label>
                        <select id="conversionMethod">
                            <option value="shisa-ai/shisa-v2-llama3.3-70b:free">Shisa (V2 Llama 3.3)</option>
                            <option value="deepseek/deepseek-r1:free">DeepSeek (R1)</option>
                            <option value="openai/gpt-oss-20b:free">OpenAI (gpt-oss-20b)</option>
                        </select>
                        <p id="llmDisclaimer" data-key="llmDisclaimer"></p>
                    </div>
                    <div id="loadingSpinner" class="spinner" style="display: none;"></div>

                    <div class="results" id="results" style="display:none;">
                        <div class="result-item">
                            <span class="result-label" data-key="hiragana">Hiragana:</span>
                            <span class="result-value" id="hiraganaResult"></span>
                            <button class="copy-button" onclick="copyToClipboard('hiraganaResult')" data-key="copy">Copy</button>
                        </div>
                        <div class="result-item">
                            <span class="result-label" data-key="katakana">Katakana:</span>
                            <span class="result-value" id="katakanaResult"></span>
                            <button class="copy-button" onclick="copyToClipboard('katakanaResult')" data-key="copy">Copy</button>
                        </div>
                        <div class="result-item">
                            <span class="result-label" data-key="halfWidth">Half Width Katakana:</span>
                            <span class="result-value" id="halfWidthKatakanaResult"></span>
                            <button class="copy-button" onclick="copyToClipboard('halfWidthKatakanaResult')" data-key="copy">Copy</button>
                        </div>
                        <div class="result-item">
                            <span class="result-label" data-key="romanji">Romanji:</span>
                            <span class="result-value" id="romanjiResult"></span>
                            <button class="copy-button" onclick="copyToClipboard('romanjiResult')" data-key="copy">Copy</button>
                        </div>
                    </div>

                    <div class="notification" id="copyNotification">Copied!</div>
                </div>
            </div>
        </div>
        <div class="tab-content" id="mapTab">
            <div class="page wide-page">
                <div class="container wide-container" style="height: 85vh;">
                <iframe src="/game/map.html" style="width: 100%; height: 100%; border: none;"></iframe>
                </div>
            </div>
        </div>
        <script src="js/app.js" defer></script>
    </body>
</html>
